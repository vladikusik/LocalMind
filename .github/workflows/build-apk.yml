name: Build LocalMind APK

on:
  push:
  workflow_dispatch:
    inputs:
      include_mlc_runtime:
        description: "Compile & bundle TVM mlc4j native GPU runtime (libtvm4j_runtime_packed.so)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses & install Android 36.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Cache compiled MLC-LLM TVM Android runtime (mlc4j)
        id: cache-mlc
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_mlc_runtime != false }}
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so
            app/libs/tvm4j_core.jar
            app/libs/mlc4j-ffi.jar
            app/src/main/assets/mlc-app-config.json
          key: mlc4j-android-v1-${{ hashFiles('mlc-package-config.json') }}

      - name: Build MLC-LLM TVM native runtime (mlc4j) for arm64-v8a
        id: build-mlc
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.include_mlc_runtime != false) && steps.cache-mlc.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::group::Install NDK, CMake, Rust arm64 target, and mlc-llm-nightly-cpu"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.0.12077973"
          export TVM_NDK_CC="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$HOME/.cargo/bin:$PATH"

          rustup target add aarch64-linux-android
          mkdir -p "$HOME/.cargo"
          cat <<EOF >> "$HOME/.cargo/config.toml"
          [target.aarch64-linux-android]
          linker = "$TVM_NDK_CC"
          EOF

          python3 -m pip install --upgrade pip
          python3 -m pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cpu mlc-llm-nightly-cpu
          echo "::endgroup::"

          echo "::group::Clone mlc-ai/mlc-llm sources and package Android mlc4j"
          MLC_WORK="$RUNNER_TEMP/mlc-build"
          rm -rf "$MLC_WORK"
          mkdir -p "$MLC_WORK"
          git clone --depth 1 --recursive --shallow-submodules https://github.com/mlc-ai/mlc-llm.git "$MLC_WORK/mlc-llm"
          export MLC_LLM_SOURCE_DIR="$MLC_WORK/mlc-llm"
          export TVM_SOURCE_DIR="$MLC_WORK/mlc-llm/3rdparty/tvm"

          mkdir -p "$MLC_WORK/pkg"
          cp mlc-package-config.json "$MLC_WORK/pkg/mlc-package-config.json"
          cd "$MLC_WORK/pkg"
          mlc_llm package --mlc-llm-source-dir "$MLC_LLM_SOURCE_DIR"
          echo "::endgroup::"

          echo "::group::Install compiled libtvm4j_runtime_packed.so, jars, and mlc-app-config.json"
          cd "$GITHUB_WORKSPACE"
          SO_PATH=$(find "$MLC_WORK/pkg/dist" -name "libtvm4j_runtime_packed.so" | head -n 1 || true)
          TVM_JAR=$(find "$MLC_WORK/pkg/dist" -name "tvm4j_core.jar" | head -n 1 || true)
          APP_CFG=$(find "$MLC_WORK/pkg/dist" -name "mlc-app-config.json" | head -n 1 || true)

          if [ -z "$SO_PATH" ] || [ -z "$TVM_JAR" ]; then
            echo "ERROR: mlc_llm package did not produce libtvm4j_runtime_packed.so or tvm4j_core.jar"
            exit 1
          fi

          mkdir -p app/src/main/jniLibs/arm64-v8a app/libs app/src/main/assets
          cp "$SO_PATH" app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so
          cp "$TVM_JAR" app/libs/tvm4j_core.jar
          if [ -n "$APP_CFG" ]; then
            cp "$APP_CFG" app/src/main/assets/mlc-app-config.json
          fi

          # Compile ai.mlc.mlcllm.JSONFFIEngine.java against tvm4j_core.jar into app/libs/mlc4j-ffi.jar
          JSON_FFI_JAVA=$(find "$MLC_LLM_SOURCE_DIR/android/mlc4j" -name "JSONFFIEngine.java" | head -n 1 || true)
          if [ -n "$JSON_FFI_JAVA" ]; then
            mkdir -p "$MLC_WORK/ffi_classes"
            javac --release 11 -cp app/libs/tvm4j_core.jar -d "$MLC_WORK/ffi_classes" "$JSON_FFI_JAVA"
            jar cf app/libs/mlc4j-ffi.jar -C "$MLC_WORK/ffi_classes" .
          else
            echo "ERROR: JSONFFIEngine.java not found in $MLC_LLM_SOURCE_DIR/android/mlc4j"
            exit 1
          fi
          ls -lh app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so app/libs/tvm4j_core.jar app/libs/mlc4j-ffi.jar
          echo "::endgroup::"

      - name: Verify MLC TVM native bundle status
        id: mlc-status
        run: |
          if [ -f app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so ] && \
             [ -f app/libs/tvm4j_core.jar ] && \
             [ -f app/libs/mlc4j-ffi.jar ]; then
            echo "bundled=true" >> "$GITHUB_OUTPUT"
            echo "MLC TVM native runtime IS bundled in this APK."
          else
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            rm -f app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so app/libs/tvm4j_core.jar app/libs/mlc4j-ffi.jar
            echo "MLC TVM native runtime was NOT bundled; continuing with LiteRT-LM (NPU/GPU), MediaPipe & llama.cpp."
          fi

      - name: Prepare consistent signing keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compute monotonic version code & changelog
        id: version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "### Що нового у LocalMind v${VERSION_NAME} (build ${VERSION_CODE})"
            echo ""
            if [ "${{ steps.mlc-status.outputs.bundled }}" = "true" ]; then
              echo "- Вбудовано нативний **MLC-LLM TVM OpenCL/Vulkan GPU runtime** (\`libtvm4j_runtime_packed.so\` + \`mlc4j\`) для Llama-3.2, Qwen2.5, SmolLM2, Gemma-2, Phi-3.5"
            else
              echo "- Нативні рушії у цьому APK: **LiteRT-LM (QNN NPU / OpenCL-Vulkan GPU)**, **MediaPipe GenAI**, **llama.cpp (GGUF)**"
            fi
            git log -n 6 --pretty=format:"- %s" || true
            echo ""
            echo ""
            echo "Оновлення встановлюється поверх попередньої версії без видалення даних, чатів та завантажених моделей."
          } > release_notes.md

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Assemble versioned APK
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare release APK & checksum
        run: |
          APK_NAME="LocalMind-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "apk_name=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-APK
          path: ${{ env.apk_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" "${{ env.apk_name }}" "${{ env.apk_name }}.sha256" \
            --title "LocalMind $TAG" \
            --notes-file release_notes.md \
            --latest
