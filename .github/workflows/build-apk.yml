name: Build LocalMind APK

on:
  push:
  workflow_dispatch:
    inputs:
      include_mlc_runtime:
        description: "Bundle official prebuilt TVM mlc4j native GPU runtime (libtvm4j_runtime_packed.so)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses & install Android 36.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Cache compiled MLC-LLM TVM Android runtime (mlc4j + GPU kernels)
        id: cache-mlc
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_mlc_runtime != false }}
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so
            app/libs/mlc4j-runtime.jar
            app/src/main/assets/mlc-app-config.json
          key: mlc4j-source-package-v1

      - name: Set up Python 3.11 for MLC-LLM compiler
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.include_mlc_runtime != false) && steps.cache-mlc.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust Android target for MLC tokenizers
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.include_mlc_runtime != false) && steps.cache-mlc.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Compile official MLC-LLM TVM native runtime (mlc4j) for curated Android models
        id: build-mlc
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.include_mlc_runtime != false) && steps.cache-mlc.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          MLC_WORK="$RUNNER_TEMP/mlc-build"
          rm -rf "$MLC_WORK"
          mkdir -p "$MLC_WORK/pkg" "$MLC_WORK/jar_stage"

          echo "::group::Install host build tools & locate Android NDK r27"
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build maven git-lfs >/dev/null
          git lfs install --skip-smudge || true

          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          export ANDROID_NDK="$NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          export TVM_NDK_CC="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export PATH="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TVM_NDK_CC"
          export CC_aarch64_linux_android="$TVM_NDK_CC"
          export CXX_aarch64_linux_android="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export GIT_LFS_SKIP_SMUDGE=1
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "TVM_NDK_CC=$TVM_NDK_CC"
          test -x "$TVM_NDK_CC"
          echo "::endgroup::"

          echo "::group::Install mlc-llm & mlc-ai nightly compiler wheels"
          python3 -m pip install --upgrade pip -q
          python3 -m pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cpu mlc-ai-nightly-cpu
          python3 -c "import tvm, mlc_llm; print('TVM:', tvm.__file__, 'MLC:', mlc_llm.__file__)"
          echo "::endgroup::"

          echo "::group::Clone mlc-ai/mlc-llm source tree for Android mlc4j & runtime cross-compilation"
          git clone --depth 1 --recursive --shallow-submodules https://github.com/mlc-ai/mlc-llm.git "$MLC_WORK/mlc-llm"
          export MLC_LLM_SOURCE_DIR="$MLC_WORK/mlc-llm"
          export TVM_SOURCE_DIR="$MLC_WORK/mlc-llm/3rdparty/tvm"
          echo "::endgroup::"

          echo "::group::Generate mlc-package-config.json & compile Android GPU kernels via mlc_llm package"
          python3 - "$MLC_WORK/pkg" << 'PY_PKG'
          import json, os, shutil, subprocess, sys, urllib.request

          pkg_dir = sys.argv[1]
          candidates = [
              ("mlc-ai/Llama-3.2-3B-Instruct-q4f16_1-MLC", 2600000000),
              ("mlc-ai/Llama-3.2-1B-Instruct-q4f16_1-MLC", 1100000000),
              ("mlc-ai/Qwen2.5-1.5B-Instruct-q4f16_1-MLC", 1400000000),
              ("mlc-ai/Qwen2.5-3B-Instruct-q4f16_1-MLC", 2500000000),
              ("mlc-ai/SmolLM2-1.7B-Instruct-q4f16_1-MLC", 1500000000),
              ("mlc-ai/gemma-2-2b-it-q4f16_1-MLC", 2100000000),
              ("mlc-ai/Phi-3.5-mini-instruct-q4f16_1-MLC", 2900000000),
          ]

          verified = []
          for repo_id, vram in candidates:
              url = f"https://huggingface.co/{repo_id}/resolve/main/mlc-chat-config.json"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "LocalMind-CI"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      if isinstance(data, dict) and data.get("model_type"):
                          model_id = repo_id.split("/", 1)[1]
                          verified.append({
                              "model": f"HF://{repo_id}",
                              "model_id": model_id,
                              "estimated_vram_bytes": vram,
                              "bundle_weight": False,
                              "overrides": {
                                  "context_window_size": 4096,
                                  "prefill_chunk_size": 512,
                              },
                          })
                          print(f"Verified HF MLC repo: {repo_id} (type={data.get('model_type')})")
              except Exception as exc:
                  print(f"Skipping unavailable HF repo {repo_id}: {exc}")

          if not verified:
              raise SystemExit("ERROR: No HuggingFace MLC repos were reachable!")

          help_out = subprocess.check_output(
              [sys.executable, "-m", "mlc_llm", "package", "--help"],
              text=True,
              errors="replace",
          )
          use_explicit_flags = "--package-config" in help_out and "--output" in help_out

          def run_package(entries, label):
              cfg_path = os.path.join(pkg_dir, "mlc-package-config.json")
              dist_dir = os.path.join(pkg_dir, "dist")
              if os.path.exists(dist_dir):
                  shutil.rmtree(dist_dir)
              cfg = {"device": "android", "model_list": entries}
              with open(cfg_path, "w", encoding="utf-8") as f:
                  json.dump(cfg, f, indent=2)
              print(f"=== Running mlc_llm package ({label}: {len(entries)} models) ===")
              cmd = [sys.executable, "-m", "mlc_llm", "package"]
              if use_explicit_flags:
                  cmd += ["--package-config", cfg_path, "--output", dist_dir]
              res = subprocess.run(cmd, cwd=pkg_dir)
              return res.returncode == 0

          core_ids = {
              "Llama-3.2-3B-Instruct-q4f16_1-MLC",
              "Llama-3.2-1B-Instruct-q4f16_1-MLC",
              "Qwen2.5-1.5B-Instruct-q4f16_1-MLC",
              "Qwen2.5-3B-Instruct-q4f16_1-MLC",
          }
          batches = [
              ("all-curated", verified),
              ("core-4", [e for e in verified if e["model_id"] in core_ids]),
              ("primary-llama-3.2-3b", [verified[0]]),
          ]
          seen = set()
          for label, batch in batches:
              if not batch:
                  continue
              key = tuple(e["model_id"] for e in batch)
              if key in seen:
                  continue
              seen.add(key)
              if run_package(batch, label):
                  print(f"SUCCESS: mlc_llm package completed for batch '{label}'")
                  sys.exit(0)
              print(f"WARNING: mlc_llm package batch '{label}' failed; trying fallback batch...")

          raise SystemExit("ERROR: mlc_llm package failed for all model batches!")
          PY_PKG
          echo "::endgroup::"

          echo "::group::Package libtvm4j_runtime_packed.so, mlc4j-runtime.jar (JSONFFIEngine) & mlc-app-config.json"
          SO_PATH=$(find "$MLC_WORK/pkg/dist" -name "libtvm4j_runtime_packed.so" | head -n 1 || true)
          TVM4J_JAR=$(find "$MLC_WORK/pkg/dist" -name "tvm4j_core.jar" | head -n 1 || true)
          APP_CFG=$(find "$MLC_WORK/pkg/dist" -name "mlc-app-config.json" | head -n 1 || true)

          if [ -z "$SO_PATH" ] || [ ! -s "$SO_PATH" ]; then
            echo "ERROR: libtvm4j_runtime_packed.so not produced by mlc_llm package!"
            find "$MLC_WORK/pkg/dist" -maxdepth 5 || true
            exit 1
          fi
          if [ -z "$TVM4J_JAR" ] || [ ! -s "$TVM4J_JAR" ]; then
            echo "ERROR: tvm4j_core.jar not produced by mlc_llm package!"
            find "$MLC_WORK/pkg/dist" -maxdepth 5 || true
            exit 1
          fi
          if [ -z "$APP_CFG" ] || [ ! -s "$APP_CFG" ]; then
            echo "ERROR: mlc-app-config.json not produced by mlc_llm package!"
            find "$MLC_WORK/pkg/dist" -maxdepth 5 || true
            exit 1
          fi

          mkdir -p app/src/main/jniLibs/arm64-v8a app/libs app/src/main/assets
          cp "$SO_PATH" app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so
          cp "$APP_CFG" app/src/main/assets/mlc-app-config.json

          echo "Dynamic dependencies (NEEDED) of libtvm4j_runtime_packed.so:"
          readelf -d app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so | grep NEEDED || true
          echo "Generated mlc-app-config.json:"
          cat app/src/main/assets/mlc-app-config.json

          unzip -qo "$TVM4J_JAR" -d "$MLC_WORK/jar_stage"
          rm -rf "$MLC_WORK/jar_stage/META-INF"

          ANDROID_JAR="$ANDROID_HOME/platforms/android-36.1/android.jar"
          JAVA_SRCS=$(find "$MLC_LLM_SOURCE_DIR/android/mlc4j/src/main/java" -name "*.java")
          echo "Compiling official mlc4j Java sources:"
          echo "$JAVA_SRCS"
          javac --release 11 -cp "$TVM4J_JAR:$ANDROID_JAR" -d "$MLC_WORK/jar_stage" $JAVA_SRCS

          if find "$MLC_WORK/jar_stage" -name "*.class" -exec javap -v {} + 2>/dev/null | grep -q "org/slf4j/"; then
            if [ ! -f "$MLC_WORK/jar_stage/org/slf4j/LoggerFactory.class" ]; then
              echo "Bundling slf4j-api + slf4j-nop for tvm4j_core.jar..."
              curl -fSL -o "$MLC_WORK/slf4j-api.jar" "https://repo1.maven.org/maven2/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar"
              curl -fSL -o "$MLC_WORK/slf4j-nop.jar" "https://repo1.maven.org/maven2/org/slf4j/slf4j-nop/1.7.36/slf4j-nop-1.7.36.jar"
              unzip -qo "$MLC_WORK/slf4j-api.jar" "org/slf4j/*" -d "$MLC_WORK/jar_stage"
              unzip -qo "$MLC_WORK/slf4j-nop.jar" "org/slf4j/*" -d "$MLC_WORK/jar_stage"
            fi
          fi

          jar cf app/libs/mlc4j-runtime.jar -C "$MLC_WORK/jar_stage" .
          test -f "$MLC_WORK/jar_stage/org/apache/tvm/Function.class"
          test -f "$MLC_WORK/jar_stage/ai/mlc/mlcllm/JSONFFIEngine.class"
          echo "Compiled JSONFFIEngine API:"
          javap -p -cp app/libs/mlc4j-runtime.jar ai.mlc.mlcllm.JSONFFIEngine || true
          ls -lh app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so app/libs/mlc4j-runtime.jar
          echo "::endgroup::"

      - name: Verify MLC TVM native bundle status
        id: mlc-status
        run: |
          if [ -f app/src/main/jniLibs/arm64-v8a/libtvm4j_runtime_packed.so ] && \
             [ -f app/libs/mlc4j-runtime.jar ]; then
            echo "bundled=true" >> "$GITHUB_OUTPUT"
            MODELS=""
            if [ -f app/src/main/assets/mlc-app-config.json ]; then
              MODELS=$(python3 -c "import json; d=json.load(open('app/src/main/assets/mlc-app-config.json')); print(', '.join(m.get('model_id','') for m in d.get('model_list',[]) if m.get('model_id')))" || true)
            fi
            echo "models=$MODELS" >> "$GITHUB_OUTPUT"
            echo "MLC TVM native runtime IS bundled in this APK. Models: $MODELS"
          else
            if [ "${{ github.event_name != 'workflow_dispatch' || inputs.include_mlc_runtime != false }}" = "true" ]; then
              echo "ERROR: MLC runtime was requested but artifacts are missing!"
              exit 1
            fi
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            echo "models=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cached fallback signing keystore (if repo has no keystore file or secret)
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: localmind-stable-keystore-v1

      - name: Prepare consistent signing keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          SOURCE="unknown"
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            SOURCE="GitHub Secret (SIGNING_KEYSTORE_BASE64)"
          elif [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            SOURCE="Repo debug.keystore.base64"
          elif [ -f debug.keystore ] && [ -s debug.keystore ]; then
            SOURCE="GitHub Actions Cache (stable fallback)"
          else
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            SOURCE="Newly generated (will be cached; commit debug.keystore.base64 or set SIGNING_KEYSTORE_BASE64 secret for permanent in-place updates)"
            echo "::warning::debug.keystore.base64 was not found in repository! Generated a fallback keystore."
          fi

          SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/ {print $2; exit}')
          echo "Keystore source: $SOURCE"
          echo "Signing cert SHA-256: $SHA256"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Compute monotonic version code & changelog
        id: version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "### Що нового у LocalMind v${VERSION_NAME} (build ${VERSION_CODE})"
            echo ""
            if [ "${{ steps.mlc-status.outputs.bundled }}" = "true" ]; then
              echo "- Вбудовано нативний **MLC-LLM TVM OpenCL/Vulkan GPU runtime** (\`libtvm4j_runtime_packed.so\` + \`mlc4j\`)"
              if [ -n "${{ steps.mlc-status.outputs.models }}" ]; then
                echo "- Скомпільовані MLC GPU ядра в цьому APK: ${{ steps.mlc-status.outputs.models }}"
              fi
            else
              echo "- Нативні рушії у цьому APK: **LiteRT-LM (QNN NPU / OpenCL-Vulkan GPU)**, **MediaPipe GenAI**, **llama.cpp (GGUF)**"
            fi
            git log -n 6 --pretty=format:"- %s" || true
            echo ""
            echo ""
            echo "Підпис APK (SHA-256): \`${{ steps.keystore.outputs.sha256 }}\` (${{ steps.keystore.outputs.source }})"
            echo ""
            echo "Оновлення встановлюється поверх попередньої версії (з тим самим SHA-256 підпису) без видалення даних, чатів та завантажених моделей."
          } > release_notes.md

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Assemble versioned APK
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache

      - name: Verify APK versionCode, signing certificate & bundled MLC native library
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK_PATH" | head -n 1)
          echo "APK badging: $BADGING"
          EXPECTED_CODE="versionCode='${{ steps.version.outputs.code }}'"
          if [[ "$BADGING" != *"$EXPECTED_CODE"* ]]; then
            echo "ERROR: APK does not contain expected $EXPECTED_CODE!"
            exit 1
          fi

          if [ "${{ steps.mlc-status.outputs.bundled }}" = "true" ]; then
            if ! unzip -l "$APK_PATH" | grep -q "lib/arm64-v8a/libtvm4j_runtime_packed.so"; then
              echo "ERROR: libtvm4j_runtime_packed.so is missing from the final APK!"
              exit 1
            fi
            echo "Verified: lib/arm64-v8a/libtvm4j_runtime_packed.so is packaged inside $APK_PATH"
          fi

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK_PATH"

      - name: Prepare release APK & checksum
        run: |
          APK_NAME="LocalMind-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "apk_name=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-APK
          path: ${{ env.apk_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" "${{ env.apk_name }}" "${{ env.apk_name }}.sha256" \
            --title "LocalMind $TAG" \
            --notes-file release_notes.md \
            --latest
